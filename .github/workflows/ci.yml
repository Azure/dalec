name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      source_policy:
        description: 'Enable BuildKit source policy'
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - release/**
    paths-ignore:
      - 'cmd/website/**'
      - 'netlify.toml'
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/workflows/retag.yml'
      - '.github/workflows/retag/**'
      - 'cmd/retagger/**'
      - 'cmd/worker-image-matrix/**'
      - '.github/workflows/worker-images/**'
      - '.github/workflows/worker-images.yml'
      - '.github/workflows/dependabot.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy-docs.yml'

  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - 'cmd/website/**'
      - 'netlify.toml'
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/workflows/retag.yml'
      - '.github/workflows/retag/**'
      - 'cmd/retagger/**'
      - 'cmd/worker-image-matrix/**'
      - '.github/workflows/worker-images/**'
      - '.github/workflows/worker-images.yml'

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false
      # Use the golang-ci lint action which automattically sets up GHA caching and other things
      # Note: There is also a "lint" target in docker-bake.hcl for local linting
      # If you make changes to this, please make sure to also update the local linting target
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.8.0
          args: --timeout=30m
      - name: custom linters
        run: go run ./cmd/lint ./...
      - name: validate generated files
        run: |
          go generate ./... || exit $?
          if ! git diff --exit-code; then
            echo "::error::Missing updates to generated files. Please run 'go generate ./...' and commit the changes"
            exit 1
          fi

  integration:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - Azlinux3
          - Azlinux4
          - Bookworm
          - Bullseye
          - Bionic
          - Focal
          - Jammy
          - Noble
          - Resolute
          - Windows
          - Almalinux8
          - Almalinux9
          - Rockylinux8
          - Rockylinux9
          - SLES15
          - Trixie
          - other
        include:
          - suite: other
            skip: Azlinux3|Azlinux4|Bookworm|Bullseye|Bionic|Focal|Jammy|Noble|Resolute|Windows|Almalinux8|Almalinux9|Rockylinux8|Rockylinux9|SLES15|Trixie

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download Go modules in the background so it overlaps the docker setup
      # chain and builds below instead of adding to it. Nothing docker-related,
      # and the host `go test` that consumes it fetches modules itself if they
      # aren't ready, so no explicit wait is needed; the implicit wait-all joins
      # it at job end.
      - name: download deps
        run: go mod download
        background: true

      # Free host disk we don't use (unused language toolchains) in the
      # background. Pure filesystem work with no docker interaction, so it
      # overlaps the docker setup chain. The removals finish well before the
      # builds create disk pressure, so no explicit wait is needed; the
      # implicit wait-all joins it at job end.
      - name: Free host disk space
        run: .github/scripts/free-host-disk.sh
        background: true

      - name: Docker info
        run: |
          docker version
          docker info

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        name: Login to GHCR
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup otel-collector
        run: |
          set -e
          mkdir -p /tmp/otel-traces
          chmod 777 /tmp/otel-traces

          if ! docker run -d --net=host --restart=always --name otel-collector \
            -v ${{ github.workspace }}/.github/otel-collector-ci.yaml:/etc/otelcol-contrib/config.yaml:ro \
            -v /tmp/otel-traces:/data:rw \
            otel/opentelemetry-collector-contrib:0.144.0; then
            echo "::warning::Failed to start otel-collector for tracing, skipping trace configuration"
            exit 0
          fi

          echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318" >> "${GITHUB_ENV}"
          echo "OTEL_SERVICE_NAME=dalec-integration-test" >> "${GITHUB_ENV}"

          tmp="$(mktemp)"
          echo "[Service]" > "${tmp}"
          echo "Environment=\"OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318\"" >> "${tmp}"

          sudo mkdir -p /etc/systemd/system/docker.service.d
          sudo mkdir -p /etc/systemd/system/containerd.service.d
          sudo cp "${tmp}" /etc/systemd/system/docker.service.d/otlp.conf
          sudo cp "${tmp}" /etc/systemd/system/containerd.service.d/otlp.conf

          if ! sudo systemctl daemon-reload; then
            echo "::warning::Failed to reload systemd daemon for tracing configuration"
          fi
          if ! sudo systemctl restart containerd; then
            echo "::warning::Failed to restart containerd with tracing configuration"
          fi
          if ! sudo systemctl restart docker; then
            echo "::warning::Failed to restart docker with tracing configuration"
          fi

      - name: Setup QEMU
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install all
      - name: Setup source policy
        if: inputs.source_policy
        uses: ./.github/actions/setup-source-policy
      - name: Docker cleanup
        run: |
          echo "================ INITIAL DISK USAGE ================"
          df -h
          echo

          echo "================ DOCKER: SYSTEM PRUNE (IMAGES + VOLUMES) ================"
          echo "Removing stopped containers, unused images, networks, and volumes..."
          docker system prune -f --all --volumes || true
          df -h
          echo

          echo "================ DOCKER: FINAL CLEANUP ================"
          echo "Removing dangling build cache and leftover images..."
          docker system prune -af || true
          docker builder prune -af || true
          df -h
          echo

          echo "================ CLEANUP COMPLETE ================"
      - name: Use azure ubuntu archive
        uses: ./.github/actions/dns-spoof-ubuntu-archive
      - name: Setup builder
        run: |
          buildkit_image_id_file="$(mktemp)"
          docker buildx build --target=buildkit --iidfile="${buildkit_image_id_file}" .
          BUILDKIT_TEST_IMAGE="$(<"${buildkit_image_id_file}")"

          # Use a buildx container builder pinned to the buildkit version under
          # test so the integration suite runs against it instead of the
          # engine's embedded buildkit. dial-stdio (used by the test harness)
          # and the bake pre-builds all target the current builder.
          #
          # Disable buildkit GC. It has been evicting persistent caches
          # mid-build and causing flakes; freeing up runner disk earlier in the
          # job makes keeping the cache around for the whole run feasible.
          printf '[worker.oci]\n  gc = false\n' > /tmp/buildkitd.toml
          docker buildx create --use \
            --driver-opt network=host \
            --driver-opt image=${BUILDKIT_TEST_IMAGE} \
            --buildkitd-config /tmp/buildkitd.toml
      - name: Pre-build base images
        run: |
          set -eu

          docker buildx bake frontend

          if [ "${TEST_SUITE}" = "other" ]; then
            exit 0
          fi

          # downcase the test suite to get the worker target
          worker="${TEST_SUITE,,}"
          if [ "${worker}" = "windows" ]; then
            worker="windowscross"
          fi
          export WORKER_TARGET=${worker}/worker
          docker buildx bake worker
        env:
          TEST_SUITE: ${{ matrix.suite }}
      - name: Run integration tests (with coverage tracking)
        run: |
          set -ex
          mkdir -p coverage

          # The frontend covdata files (covmeta/covcounters) are written by the test harness
          # (writeFrontendCovdata) on the RUNNER filesystem.
          export DALEC_FRONTEND_GOCOVERDIR="${GITHUB_WORKSPACE}/coverage/frontend-${TEST_SUITE}"
          rm -rf "${DALEC_FRONTEND_GOCOVERDIR}"
          mkdir -p "${DALEC_FRONTEND_GOCOVERDIR}"

          run=""
          skip=""
          if [ -n "${TEST_SUITE}" ] && [ "${TEST_SUITE}" != "other" ]; then
            run="-run=${TEST_SUITE}"
          fi
          if [ -n "${TEST_SKIP}" ]; then
            skip="-skip=${TEST_SKIP}"
          fi

          go test -timeout=59m -v -json \
            -covermode=atomic -coverpkg=./... \
            -coverprofile="coverage/integration-${TEST_SUITE}.out" \
            ${run} ${skip} ./test \
            | go run ./cmd/test2json2gha --slow 120s --logdir /tmp/testlogs

          # Convert frontend covdata -> legacy coverprofile
          if ! ls "${DALEC_FRONTEND_GOCOVERDIR}"/covmeta.* >/dev/null 2>&1; then
            echo "::group::frontend coverage debug"
            echo "DALEC_FRONTEND_GOCOVERDIR=${DALEC_FRONTEND_GOCOVERDIR}"
            echo "Contents:"
            ls -la "${DALEC_FRONTEND_GOCOVERDIR}" || true
            echo "Searching workspace for covmeta/covcounters..."
            find "${GITHUB_WORKSPACE}" \( -name 'covmeta.*' -o -name 'covcounters.*' \) 2>/dev/null | head -n 200 || true
            echo "::endgroup::"
            echo "::error::No frontend coverage covmeta.* found in ${DALEC_FRONTEND_GOCOVERDIR} (frontend coverage not collected)"
            exit 1
          fi

          go tool covdata textfmt \
            -i="${DALEC_FRONTEND_GOCOVERDIR}" \
            -o="coverage/frontend-${TEST_SUITE}.out"
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_SKIP: ${{ matrix.skip }}


      - name: Upload integration coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.suite }}
          path: |
            coverage/integration-${{ matrix.suite }}.out
            coverage/frontend-${{ matrix.suite }}.out  
          if-no-files-found: ignore
          retention-days: 7

      - name: Get traces
        if: always()
        run: |
          set -ex
          mkdir -p /tmp/reports
          if [ -f /tmp/otel-traces/traces.jsonl ]; then
            cp /tmp/otel-traces/traces.jsonl /tmp/reports/traces.jsonl
          else
            echo "::warning::No traces file found"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports-${{matrix.suite}}
          path: /tmp/reports/*
          retention-days: 1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-logs-${{matrix.suite}}
          path: /tmp/testlogs/*
          retention-days: 1
      - name: dump logs
        if: failure()
        id: dump-logs
        run: |
          set -e

          dir="$(mktemp -d)"
          echo "DUMP_DIR=${dir}" >> $GITHUB_OUTPUT
          sudo journalctl -u docker > "${dir}/dockerd.log"

          # Buildkit now runs inside the buildx container builder, so grab its
          # logs as well.
          for c in $(docker ps -a --filter name=buildx_buildkit --format '{{.Names}}'); do
            docker logs "${c}" > "${dir}/${c}.log" 2>&1 || true
          done
      - name: Upload buildkit logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dockerd-logs-${{ matrix.suite }}
          path: ${{ steps.dump-logs.outputs.DUMP_DIR }}/*
          retention-days: 1

  unit:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false
      - name: download deps
        run: go mod download
      - name: Run unit tests (with coverage tracking)
        run: |
          set -eux
          mkdir -p coverage

          pkgs="$(go list ./... | grep -v '/test$' | grep -v '/test/' )"
          go test -v --test.short --json \
            -covermode=atomic \
            -coverprofile="coverage/unit.out" \
            ${pkgs} \
            | go run ./cmd/test2json2gha
      - name: Upload unit coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/unit.out
          if-no-files-found: ignore
          retention-days: 7



  e2e:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        disable_diff_merge: ["1", "0"]
    name: "Test E2E (disable diff/merge: ${{ matrix.disable_diff_merge }})"
    env:
      DALEC_DISABLE_DIFF_MERGE: ${{ matrix.disable_diff_merge }}
      FRONTEND_REF: localhost:5000/dalec/frontend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need to fetch all commits so that we can diff against the base branch
          fetch-depth: 0

      - name: Expose GitHub tokens for caching
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Setup source policy
        if: inputs.source_policy
        uses: ./.github/actions/setup-source-policy
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        name: Login to GHCR
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/format-repo
        id: format-repo
      - name: Use azure ubuntu archive
        uses: ./.github/actions/dns-spoof-ubuntu-archive
      - name: Setup builder
        run: |
          # Sometimes the builder runs out of space... so cleanup anything we can first.
          docker image prune -a -f

          docker run -d --net=host ghcr.io/${{ steps.format-repo.outputs.result }}/mirror/dockerhub/library/registry:latest

          buildkit_image_id_file="$(mktemp)"
          docker buildx build --target=buildkit --iidfile="${buildkit_image_id_file}" .
          BUILDKIT_TEST_IMAGE="$(<"${buildkit_image_id_file}")"

          # Use a buildx container builder pinned to the buildkit version under
          # test so both diff/merge matrix legs exercise the same buildkitd
          # rather than diff/merge=1 falling back to the engine's embedded buildkit.
          docker buildx create --use \
            --driver-opt network=host \
            --driver-opt image=${BUILDKIT_TEST_IMAGE}
          echo USE_BUILDX=1 >> $GITHUB_ENV

          if [ "${DALEC_DISABLE_DIFF_MERGE}" = "0" ]; then
            echo FRONTEND_BAKE_TARGET="frontend-ci-full" >> $GITHUB_ENV
          else
            echo DALEC_NO_CACHE_EXPORT="1" >> $GITHUB_ENV
            echo FRONTEND_BAKE_TARGET="frontend-ci" >> $GITHUB_ENV
          fi
      - name: Build frontend image
        run: docker buildx bake ${FRONTEND_BAKE_TARGET}
      - name: test
        run: |
          docker buildx bake test
      - name: Build go-md2man example in docs
        run: |
          docker buildx bake examples
      - name: dump logs
        if: failure()
        id: dump-logs
        run: |
          set -e

          dir="$(mktemp -d)"
          f="${dir}/dockerd.log"
          echo "DOCKERD_LOG_PATH=${f}" >> $GITHUB_OUTPUT
          if [ "${USE_BUILDX}" = "1" ]; then
            docker logs $(docker ps -lq) > "${f}"
          else
            sudo journalctl -u docker > "${f}"
          fi
      - name: Upload buildkit logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dockerd-logs-diffmerge=${{ matrix.disable_diff_merge }}
          path: ${{ steps.dump-logs.outputs.DOCKERD_LOG_PATH }}
          retention-days: 1
  coverage-report:
    runs-on: ubuntu-22.04
    needs:
      - unit
      - integration

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      - name: Download deps
        run: go mod download

      - name: Download unit coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-unit
          path: coverage

      - name: Download integration coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: coverage/_integration

      - name: Merge coverage + generate report
        run: |
          set -eux
          go install github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c

          integration_profiles="$(find coverage/_integration -type f -name 'integration-*.out' | sort | tr '\n' ' ')"
          frontend_profiles="$(find coverage/_integration -type f -name 'frontend-*.out' | sort | tr '\n' ' ')"
          if [ -z "${integration_profiles}" ]; then
            echo "::error::No integration coverage profiles found"
            exit 1
          fi

          if [ -z "${frontend_profiles}" ]; then
            echo "::error::No frontend coverage profiles found"
            exit 1
          fi

          if [ ! -f coverage/unit.out ]; then
            echo "::error::Unit coverage profile not found (coverage/unit.out)"
            exit 1
          fi

          "$(go env GOPATH)/bin/gocovmerge" coverage/unit.out ${integration_profiles} ${frontend_profiles} > coverage/all.out

          go tool cover -func=coverage/all.out | tee coverage/summary.txt
          go tool cover -html=coverage/all.out -o coverage/index.html

          total="$(tail -n 1 coverage/summary.txt | awk '{print $3}')"
          {
            echo "## Coverage"
            echo
            echo "- Total: **${total}**"
            echo "- Profiles merged: $(echo "${integration_profiles}" | wc -w) integration + $(echo "${frontend_profiles}" | wc -w) frontend"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload merged coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage/all.out
            coverage/summary.txt
            coverage/index.html
          retention-days: 14
